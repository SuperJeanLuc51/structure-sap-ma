<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Structure SAP-MA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6fd1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#66717f;--ac:#1f6fd1;--bd:#d5dbe3;--val:#eaf2fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#98a3b1;--ac:#6aaaf5;--bd:#2f3946;--val:#1d2d44}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#98a3b1;--ac:#6aaaf5;--bd:#2f3946;--val:#1d2d44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 12px;color:var(--ac);font-style:italic}
h1 small{display:block;font-size:12px;color:var(--mu);font-style:normal;font-weight:400}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 2px 3px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
#res{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:-2px 0 10px;max-height:260px;overflow:auto}
#res div{padding:10px 12px;border-bottom:1px solid var(--bd)}#res div:last-child{border:0}
#res b{display:block;font-size:14px}#res span{font-size:12px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 14px 12px;margin-top:14px}
.f{margin-top:10px}.f .k{font-size:12px;color:var(--mu);font-weight:600}
.f .v{background:var(--val);color:var(--ac);font-weight:700;border-radius:8px;padding:9px 12px;min-height:40px;word-break:break-word}
.f .v:empty::after{content:"—";color:var(--mu);font-weight:400}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:10px;padding:8px 12px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
</style></head><body><main>
<div class="top"><h1>Structure SAP-MA<small id="maj">Consultation</small></h1><div><button id="rst" hidden>Réinitialiser</button> <button id="chg" hidden>Base…</button></div></div>
<input id="file" type="file" hidden>
<div id="imp" class="card" hidden><h2 style="font-size:16px;margin:12px 0 6px">Charger la base de données</h2><p style="color:var(--mu);margin:0 0 12px">Aucune base n’est enregistrée sur cet appareil. Sélectionnez le fichier de base (<b>base_sap_ma.json</b>) : il restera sur ce téléphone et fonctionnera ensuite sans réseau.</p><button id="pick" style="background:var(--ac);color:#fff;border:0;width:100%;padding:14px;font-weight:700">Choisir le fichier</button><p id="err" style="color:#c0392b;margin:10px 0 0"></p></div>
<div id="app" hidden>
<input id="q" type="search" placeholder="Rechercher : équipement, OT, poste technique…" autocomplete="off">
<div id="res" hidden></div>
<div id="sel"></div>
<div id="out"></div>
</div>
</main>
<script>
let D,P,kids,eqs,idx,path=[],eq=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function setup(d){
  D=d;P={};kids={};eqs={};path=[];eq=null;
  D.P.forEach(p=>P[p.c]=p);
  D.P.forEach(p=>(kids[p.p]=kids[p.p]||[]).push(p));
  D.E.forEach(e=>(eqs[e.p]=eqs[e.p]||[]).push(e));
  idx=[...D.P.map(p=>({t:'p',o:p,s:norm([p.c,p.n,p.m].join(' '))})),...D.E.map(e=>({t:'e',o:e,s:norm([e.c,e.n,e.m,e.mo,e.pl,...e.ss.map(s=>s.s+' '+s.i+' '+s.k)].join(' '))}))];
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function opts(list,sel,ph){return '<option value="">'+ph+'</option>'+list.map(x=>'<option value="'+esc(x.c)+'"'+(x.c===sel?' selected':'')+'>'+esc(x.n)+'</option>').join('')}
function render(){
  let h='',lvl=['Site / niveau 1','Niveau 2','Niveau 3','Niveau 4','Niveau 5'];
  let cur='';
  for(let i=0;i<=path.length;i++){
    const ch=kids[cur]||[];
    if(!ch.length)break;
    h+='<label>'+lvl[i]+'</label><select data-i="'+i+'">'+opts(ch,path[i],'— choisir —')+'</select>';
    cur=path[i]||'';if(!cur)break;
  }
  const node=path.length?path[path.length-1]:'';
  if(node&&eqs[node]) h+='<label>Équipement</label><select id="eqs">'+opts(eqs[node],eq&&eq.c,'— choisir —')+'</select>';
  $('sel').innerHTML=h;
  document.querySelectorAll('select[data-i]').forEach(s=>s.onchange=()=>{path=path.slice(0,+s.dataset.i);if(s.value)path.push(s.value);eq=null;render()});
  const es=$('eqs');if(es)es.onchange=()=>{eq=eqs[node].find(e=>e.c===es.value)||null;render()};
  show(eq||(node?P[node]:null),!!eq,node);
}
function f(k,v){return '<div class="f"><div class="k">'+k+'</div><div class="v">'+esc(v||'')+'</div></div>'}
function subF(s){s=s||{};return f('Immatriculation',s.i)+'<div class="row">'+f('Année',s.a)+f('Marque',s.k)+'</div>'}
function ssBlock(o){
  const l=o.ss||[];
  return '<div class="f"><div class="k">Sous ensemble'+(l.length>1?' ('+l.length+')':'')+'</div><select id="ssel" style="margin:0"'+(l.length?'':' disabled')+'>'+
   (l.length?l.map((s,i)=>'<option value="'+i+'">'+esc(s.s||'(sans nom)')+'</option>').join(''):'<option>— aucun —</option>')+'</select></div><div id="subf">'+subF(l[0])+'</div>';
}
function bindSS(o){const s=$('ssel');if(s)s.onchange=()=>{$('subf').innerHTML=subF((o.ss||[])[+s.value])}}
function show(o,isEq,node){
  if(!o){$('out').innerHTML='';return}
  $('out').innerHTML='<div class="card">'+
   f('Poste technique',isEq?node:o.c)+f(isEq?'Équipement':'Désignation',isEq?o.c:o.n)+(isEq?f('Désignation',o.n):'')+
   '<div class="row">'+f('OT Machine',o.m)+f('OT Modèle',o.mo)+'</div>'+
   '<div class="row">'+f('OT Plan Entretien',o.pl)+f('OT HACCP',o.h)+'</div>'+
   ssBlock(o)+f('N° Fournisseur',o.f)+'</div>';
  bindSS(o);
}
function goto(p,e){const a=[];let c=p;while(c){a.unshift(c);c=P[c].p}path=a;eq=e||null;render();window.scrollTo(0,0)}
$('q').oninput=function(){
  const w=norm(this.value).split(/\s+/).filter(Boolean),r=$('res');
  if(!w.length){r.hidden=true;return}
  const m=idx.filter(x=>w.every(t=>x.s.includes(t))).slice(0,40);
  r.hidden=false;
  r.innerHTML=m.length?m.map((x,i)=>'<div data-i="'+i+'"><b>'+esc(x.o.n||x.o.c)+'</b><span>'+esc(x.t==='e'?x.o.c+' · '+x.o.p:x.o.c)+'</span></div>').join(''):'<div><span>Aucun résultat</span></div>';
  r.querySelectorAll('div[data-i]').forEach(d=>d.onclick=()=>{const x=m[+d.dataset.i];x.t==='e'?goto(x.o.p,x.o):goto(x.o.c);r.hidden=true;$('q').value=''});
};
$('rst').onclick=()=>{path=[];eq=null;render()};
function dbo(){return new Promise((ok,ko)=>{const r=indexedDB.open('sapma',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function dbGet(){try{const d=await dbo();return await new Promise((ok,ko)=>{const q=d.transaction('k').objectStore('k').get('base');q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})}catch(e){return null}}
async function dbSet(v){const d=await dbo();return new Promise((ok,ko)=>{const tx=d.transaction('k','readwrite');tx.objectStore('k').put(v,'base');tx.oncomplete=ok;tx.onerror=()=>ko(tx.error)})}
function start(d){setup(d);$('imp').hidden=true;$('app').hidden=false;$('rst').hidden=false;$('chg').hidden=false;$('maj').textContent='Base du '+(d.maj||'—')+' · consultation';render()}
function needImport(){$('app').hidden=true;$('imp').hidden=false;$('rst').hidden=true}
$('pick').onclick=$('chg').onclick=()=>{$('err').textContent='';$('file').value='';$('file').click()};
$('file').onchange=function(){
  const f=this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{const d=JSON.parse(r.result);if(!Array.isArray(d.P)||!Array.isArray(d.E))throw 0;await dbSet(d);start(d)}
    catch(e){$('imp').hidden=false;$('err').textContent='Fichier non reconnu. Choisissez le fichier base_sap_ma.json.'}
  };
  r.readAsText(f,'utf-8');
};
dbGet().then(d=>d&&Array.isArray(d.P)?start(d):needImport());
if('serviceWorker' in navigator){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js')}catch(e){}})}
</script></body></html>
